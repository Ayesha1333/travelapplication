version: '3.8'

services:
  # ---------- Java Backend ----------
  travel-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: travel-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Example DB connection (if using Spring Boot)
      - SPRING_DATASOURCE_URL=jdbc:mysql://travel-db:3306/traveldb?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      travel-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - travel-net

  # ---------- Database (Optional) ----------
  travel-db:
    image: mysql:8.0
    container_name: travel-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: traveldb
    ports:
      - "3306:3306"
    volumes:
      - travel-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-net

  # ---------- Frontend (The HTML app we built) ----------
  travel-ui:
    image: nginx:alpine
    container_name: travel-ui
    ports:
      - "80:80"
    volumes:
      # Mount the index.html file directly into Nginx
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - travel-api
    networks:
      - travel-net

volumes:
  travel-db-data:

networks:
  travel-net:
    driver: bridge
